ignoredBuiltDependencies:
  - sharp
  - unrs-resolver
# Transitive packages held above a version with a known advisory (pnpm audit), until their parents require it themselves.
overrides:
  source-map-js: ">=1.2.2"
  # @vercel/functions > @vercel/oidc > @vercel/cli-config pins zod 4.1.11 (reads local Vercel CLI config only); same major as ours.
  "@vercel/cli-config>zod": "4.6.7"
  # drizzle-kit > @esbuild-kit/core-utils pins esbuild 0.18 (a dev server advisory; used here only to load drizzle.config.ts).
  "@esbuild-kit/core-utils>esbuild": "0.25.12"
  # vitest 5.0.5 accepts any vite 8; 8.3.0 to 8.3.2 carry dev server advisories (GHSA-9jrq-w75r-8gcw and others).
  vite: "^8.3.5"
  # eslint and typescript-estree hold minimatch 3 and 10, both under GHSA-g3hv-75wg-m249 (fixed only in 11.0.1); the lint runs on 11
  # (checked 1 November 2026: `pnpm lint` passes, still reports a warning and still honours its ignores). Dev only: lint globs.
  minimatch: "^11.0.3"
# Next.js's router loads a page in full when its request for the page fails, and Safari's engine cancels that request as the visitor
# leaves, so the visitor was taken to that page and not where they asked (D423); the patch waits instead. Applied to whichever Next.js
# is installed, so its updates go on as before; where a new Next.js changes the lines it patches, pnpm refuses the install, and the
# patch is moved to it or dropped (e2e/store-pages.spec.ts says whether it is still needed).
patchedDependencies:
  next: patches/next.patch

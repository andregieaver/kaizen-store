<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · Kaizena Flow</title>
    <!--
      What the app shows when the site cannot be reached at launch (server.errorPath in capacitor.config.ts, D908). It lives inside the app,
      so it holds no account's data and names no one; in English and Norwegian, as no account is known here. The words are the admin's own
      offline page's (`SHELL_WORDS.*.push`), kept the same by `src/lib/native-app.test.ts`.
    -->
    <style>
      :root {
        color-scheme: light dark;
        --page: #f6f7f2;
        --card: #ffffff;
        --ink: #161c1a;
        --ink-2: #4a5451;
        --main: #2f5d50;
        --on-main: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --page: #1b2120;
          --card: #232a28;
          --ink: #eef2ef;
          --ink-2: #b7c1bd;
          --main: #8fc4b2;
          --on-main: #10201b;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        background: var(--page);
        color: var(--ink);
        font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      main {
        width: 100%;
        max-width: 420px;
        background: var(--card);
        border-radius: 20px;
        padding: 28px 24px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 22px;
        line-height: 1.25;
      }
      p {
        margin: 0 0 16px;
        color: var(--ink-2);
      }
      p strong {
        color: var(--ink);
      }
      button {
        appearance: none;
        border: 0;
        border-radius: 999px;
        padding: 12px 20px;
        min-height: 44px;
        background: var(--main);
        color: var(--on-main);
        font: inherit;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>Kaizena Flow's admin needs a connection. Your work is kept on the server; reload when you are back online.</p>
      <p lang="nb">
        <strong>Du er frakoblet.</strong> Kaizena Flows administrasjon trenger tilkobling. Arbeidet ditt er lagret på serveren; last inn på
        nytt når du er tilkoblet igjen.
      </p>
      <button type="button" id="reload">Reload · <span lang="nb">Last inn på nytt</span></button>
    </main>
    <script src="site-url.js"></script>
    <script>
      (function () {
        var admin = (window.__SITE_URL__ || "https://kaizenaflow.com") + "/admin";
        function again() {
          location.replace(admin);
        }
        document.getElementById("reload").addEventListener("click", again);
        // Back by itself once the phone has a connection again.
        window.addEventListener("online", again);
      })();
    </script>
  </body>
</html>

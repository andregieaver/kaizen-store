<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="system-ui, sans-serif" font-size="14">
  <rect width="960" height="470" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#555"/></marker></defs>
  <text x="24" y="34" font-size="18" font-weight="600" fill="#1a1a1a">An A/B test's guardrails, checked every hour (D712)</text>
  <text x="24" y="56" font-size="13" fill="#555">Whatever the goal, each version is compared with the original once every version has its minimum.</text>

  <g fill="#f4f4f5" stroke="#8a8a92" stroke-width="1.5">
    <rect x="24" y="84" width="226" height="76" rx="10"/>
    <rect x="24" y="176" width="226" height="76" rx="10"/>
    <rect x="24" y="268" width="226" height="76" rx="10"/>
    <rect x="24" y="360" width="226" height="76" rx="10"/>
  </g>
  <g fill="#1a1a1a">
    <text x="40" y="110" font-weight="600">Orders</text><text x="40" y="130" font-size="12" fill="#555">visitors who ordered</text><text x="40" y="148" font-size="12" fill="#555">from the cart's paid orders</text>
    <text x="40" y="202" font-weight="600">Speed</text><text x="40" y="222" font-size="12" fill="#555">loads slower than 2.5 s</text><text x="40" y="240" font-size="12" fill="#555">confirmed by the A/B cookie</text>
    <text x="40" y="294" font-weight="600">Payments at checkout</text><text x="40" y="314" font-size="12" fill="#555">a failed payment, no order</text><text x="40" y="332" font-size="12" fill="#555">from the cart's order payments</text>
    <text x="40" y="386" font-weight="600">Refunds and returns</text><text x="40" y="406" font-size="12" fill="#555">within 30 days of an order</text><text x="40" y="424" font-size="12" fill="#555">from returns and refunds</text>
  </g>

  <g stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <path d="M250 122H300"/><path d="M250 214H300"/><path d="M250 306H300"/><path d="M250 398H300"/>
    <path d="M530 122H600"/><path d="M530 214H600"/><path d="M530 306H600"/><path d="M530 398H600"/>
  </g>

  <g fill="#f3f1ff" stroke="#6b5bd6" stroke-width="1.5">
    <rect x="300" y="84" width="230" height="76" rx="10"/>
    <rect x="300" y="176" width="230" height="76" rx="10"/>
    <rect x="300" y="268" width="230" height="76" rx="10"/>
    <rect x="300" y="360" width="230" height="76" rx="10"/>
  </g>
  <g fill="#1a1a1a">
    <text x="316" y="110" font-weight="600">1,000 visitors a version</text><text x="316" y="130" font-size="12" fill="#555">clearly fewer than the original</text><text x="316" y="148" font-size="12" fill="#555">(z 3.29, as since phase 1)</text>
    <text x="316" y="202" font-weight="600">400 page loads a version</text><text x="316" y="222" font-size="12" fill="#555">clearly more, and at least</text><text x="316" y="240" font-size="12" fill="#555">5 in 100 more (z 3.29)</text>
    <text x="316" y="294" font-weight="600">200 checkouts a version</text><text x="316" y="314" font-size="12" fill="#555">clearly more, and at least</text><text x="316" y="332" font-size="12" fill="#555">2 in 100 more (z 3.29)</text>
    <text x="316" y="386" font-weight="600">100 buyers a version</text><text x="316" y="406" font-size="12" fill="#555">more than the original's</text><text x="316" y="424" font-size="12" fill="#555">(95 %), still coming in for 30 days</text>
  </g>

  <rect x="600" y="84" width="336" height="260" rx="10" fill="#fdecec" stroke="#c0392b" stroke-width="1.5"/>
  <g fill="#1a1a1a">
    <text x="618" y="114" font-weight="600">Stops the test</text>
    <text x="618" y="140" font-size="13">The first of orders, checkout, speed that</text>
    <text x="618" y="158" font-size="13">found a version worse, kept in</text>
    <text x="618" y="176" font-size="13" font-family="ui-monospace, monospace">experiments.stop_guardrail</text>
    <text x="618" y="206" font-size="13">The owners get an email naming it, with</text>
    <text x="618" y="224" font-size="13">that guardrail's own figures</text>
    <text x="618" y="254" font-size="13">The test's page, explain_results and the</text>
    <text x="618" y="272" font-size="13">platform's view say which</text>
    <text x="618" y="302" font-size="13">Everyone sees the original again;</text>
    <text x="618" y="320" font-size="13">nothing is applied by itself</text>
  </g>
  <rect x="600" y="360" width="336" height="76" rx="10" fill="#fff6e0" stroke="#b7791f" stroke-width="1.5"/>
  <g fill="#1a1a1a">
    <text x="618" y="388" font-weight="600">Warns, never stops</text>
    <text x="618" y="408" font-size="13">A line above the details: weigh it</text>
    <text x="618" y="426" font-size="13">before you choose a version</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <title>The AI social media manager: three phases and the loop</title>
  <rect width="960" height="520" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#475569"/></marker>
  </defs>
  <text x="32" y="40" font-size="20" font-weight="700" fill="#0f172a">The AI social media manager</text>
  <text x="32" y="62" font-size="13" fill="#475569">One area of the AI manager and autopilot; every figure by code, every post tagged and measured against orders</text>

  <!-- inputs -->
  <g font-size="13" fill="#0f172a">
    <rect x="32" y="96" width="190" height="78" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="46" y="120" font-weight="700">The store</text>
    <text x="46" y="140" fill="#475569">Goals, margin, stock,</text>
    <text x="46" y="157" fill="#475569">campaigns, season</text>
    <rect x="32" y="190" width="190" height="78" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="46" y="214" font-weight="700">The channels</text>
    <text x="46" y="234" fill="#475569">Posts, reach, saves,</text>
    <text x="46" y="251" fill="#475569">clicks, followers</text>
    <rect x="32" y="284" width="190" height="78" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="46" y="308" font-weight="700">Tagged links</text>
    <text x="46" y="328" fill="#475569">Post → visit → cart</text>
    <text x="46" y="345" fill="#475569">→ order → margin</text>
  </g>

  <!-- phases -->
  <g font-size="13">
    <rect x="500" y="96" width="200" height="266" rx="12" fill="#eef2ff" stroke="#6366f1"/>
    <text x="516" y="122" font-weight="700" fill="#3730a3">2 · Adviser</text>
    <text x="516" y="150" fill="#1e1b4b">Status-quo report</text>
    <text x="516" y="172" fill="#1e1b4b">Recommendations</text>
    <text x="516" y="190" fill="#1e1b4b">as plan steps</text>
    <text x="516" y="212" fill="#1e1b4b">Content calendar</text>
    <text x="516" y="234" fill="#1e1b4b">Weekly review</text>
    <text x="516" y="336" font-size="12" fill="#4338ca">Claude Opus 5.5 · Haiku 5.5</text>

    <rect x="270" y="96" width="200" height="266" rx="12" fill="#ecfdf5" stroke="#10b981"/>
    <text x="286" y="122" font-weight="700" fill="#065f46">1 · Post creator</text>
    <text x="286" y="150" fill="#022c22">Caption per channel</text>
    <text x="286" y="172" fill="#022c22">Pictures composed:</text>
    <text x="286" y="190" fill="#022c22">real photo + template</text>
    <text x="286" y="208" fill="#022c22">+ price set by code</text>
    <text x="286" y="230" fill="#022c22">Copy and paste by hand</text>
    <text x="286" y="252" fill="#022c22">Tagged link per post</text>
    <text x="286" y="318" font-size="12" fill="#047857">Claude Sonnet 5.5</text>
    <text x="286" y="336" font-size="12" fill="#047857">picture model for scenes</text>

    <rect x="730" y="96" width="200" height="266" rx="12" fill="#fff7ed" stroke="#f97316"/>
    <text x="746" y="122" font-weight="700" fill="#9a3412">3 · Posting</text>
    <text x="746" y="150" fill="#431407">Queue on a schedule</text>
    <text x="746" y="172" fill="#431407">Instagram, Facebook</text>
    <text x="746" y="190" fill="#431407">→ Pinterest → TikTok</text>
    <text x="746" y="208" fill="#431407">→ LinkedIn</text>
    <text x="746" y="236" fill="#431407" font-weight="700">Approve each post</text>
    <text x="746" y="254" fill="#431407">or toggle: post on its</text>
    <text x="746" y="272" fill="#431407">own within my rules</text>
    <text x="746" y="336" font-size="12" fill="#c2410c">code: limits, retries</text>
  </g>

  <g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M222 135 H266"/><path d="M222 229 H266"/><path d="M222 323 H266"/>
    <path d="M470 229 H496"/><path d="M700 229 H726"/>
    <path d="M830 362 V430 H127 V366" stroke-dasharray="6 5"/>
  </g>
  <text x="400" y="452" font-size="13" fill="#475569">What each post sold flows back into the next plan</text>

  <rect x="32" y="474" width="896" height="30" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="46" y="494" font-size="12" fill="#334155">A paid extension (bought alone or included in a plan) · Kaizena Flow's own accounts get it too · comments, DMs and paid boosting come later</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="system-ui, sans-serif" font-size="14">
  <rect width="960" height="640" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#555"/></marker></defs>
  <text x="24" y="34" font-size="18" font-weight="600" fill="#1a1a1a">An account, its plan and its extensions (D748)</text>

  <!-- Account -->
  <rect x="290" y="56" width="380" height="64" rx="10" fill="#f3f1ff" stroke="#6b5bd6" stroke-width="1.5"/>
  <text x="480" y="83" text-anchor="middle" font-weight="600" fill="#1a1a1a">Account (an organisation)</text>
  <text x="480" y="104" text-anchor="middle" font-size="12" fill="#555">people are members · one business · one Stripe customer</text>

  <g stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <path d="M380 120L190 168"/><path d="M480 120V168"/><path d="M580 120L770 168"/>
  </g>

  <!-- Plan -->
  <rect x="24" y="168" width="300" height="168" rx="10" fill="#eef5ff" stroke="#3b6fd6" stroke-width="1.5"/>
  <text x="174" y="194" text-anchor="middle" font-weight="600" fill="#1a1a1a">Core plan (or none)</text>
  <g font-size="12" fill="#333">
    <text x="40" y="220">• how many stores the account may have</text>
    <text x="40" y="242">• usage limits counted across the account</text>
    <text x="40" y="264">• the fee on every store's sales</text>
    <text x="40" y="286">• extensions it includes, at no extra cost</text>
    <text x="40" y="308">• at a limit: move up a plan</text>
  </g>

  <!-- Stores -->
  <rect x="340" y="168" width="280" height="168" rx="10" fill="#f6f6f6" stroke="#888" stroke-width="1.5"/>
  <text x="480" y="194" text-anchor="middle" font-weight="600" fill="#1a1a1a">Stores: 0 up to the limit</text>
  <g fill="#ffffff" stroke="#aaa"><rect x="360" y="212" width="74" height="40" rx="6"/><rect x="443" y="212" width="74" height="40" rx="6"/><rect x="526" y="212" width="74" height="40" rx="6" stroke-dasharray="4 3"/></g>
  <g font-size="12" fill="#333" text-anchor="middle"><text x="397" y="237">Store A</text><text x="480" y="237">Store B</text><text x="563" y="237">…</text></g>
  <text x="480" y="280" text-anchor="middle" font-size="12" fill="#555">no plan, no stores: a standalone account,</text>
  <text x="480" y="298" text-anchor="middle" font-size="12" fill="#555">its data kept in a hidden workspace</text>
  <text x="480" y="316" text-anchor="middle" font-size="12" fill="#555">(no website, no shop)</text>

  <!-- Extensions -->
  <rect x="636" y="168" width="300" height="168" rx="10" fill="#e8f6ec" stroke="#2f8a4b" stroke-width="1.5"/>
  <text x="786" y="194" text-anchor="middle" font-weight="600" fill="#1a1a1a">Extensions (per account)</text>
  <g font-size="12" fill="#333">
    <text x="652" y="220">A/B testing (stores only)</text>
    <text x="652" y="242">AI support desk ★</text>
    <text x="652" y="264">Email automation ★</text>
    <text x="652" y="286">Work: time, invoices, books ★</text>
    <text x="652" y="308">Deals and contracts ★</text>
  </g>
  <text x="920" y="326" text-anchor="end" font-size="11" fill="#2f8a4b">★ also sold on its own</text>

  <!-- How an extension is had -->
  <text x="24" y="378" font-size="15" font-weight="600" fill="#1a1a1a">An account has an extension when any of these holds</text>
  <g font-size="12">
    <rect x="24" y="392" width="170" height="44" rx="8" fill="#eef5ff" stroke="#3b6fd6"/><text x="109" y="418" text-anchor="middle" fill="#1a1a1a">the plan includes it</text>
    <rect x="210" y="392" width="170" height="44" rx="8" fill="#e8f6ec" stroke="#2f8a4b"/><text x="295" y="418" text-anchor="middle" fill="#1a1a1a">bought on its own</text>
    <rect x="396" y="392" width="170" height="44" rx="8" fill="#e8f6ec" stroke="#2f8a4b"/><text x="481" y="418" text-anchor="middle" fill="#1a1a1a">bought in a bundle</text>
    <rect x="582" y="392" width="170" height="44" rx="8" fill="#fff6e5" stroke="#c98a12"/><text x="667" y="418" text-anchor="middle" fill="#1a1a1a">in its trial or grace</text>
    <rect x="768" y="392" width="168" height="44" rx="8" fill="#f3f1ff" stroke="#6b5bd6"/><text x="852" y="418" text-anchor="middle" fill="#1a1a1a">it is the platform</text>
  </g>
  <text x="24" y="458" font-size="12" fill="#555">Otherwise its screens, links, cards, AI tools and connections are absent; one quiet marker offers its trial.</text>

  <!-- Life of an extension -->
  <text x="24" y="486" font-size="15" font-weight="600" fill="#1a1a1a">An extension's life on one account</text>
  <g stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <path d="M154 546H184"/><path d="M324 546H354"/><path d="M494 546H524"/><path d="M664 546H694"/>
    <path d="M779 576V606H424V578"/>
  </g>
  <g font-size="12" text-anchor="middle">
    <rect x="24" y="520" width="130" height="52" rx="8" fill="#f6f6f6" stroke="#888"/><text x="89" y="542" font-weight="600" fill="#1a1a1a">Absent</text><text x="89" y="560" fill="#555">a marker only</text>
    <rect x="184" y="520" width="140" height="52" rx="8" fill="#fff6e5" stroke="#c98a12"/><text x="254" y="542" font-weight="600" fill="#1a1a1a">Trial</text><text x="254" y="560" fill="#555">14 days, once</text>
    <rect x="354" y="520" width="140" height="52" rx="8" fill="#e8f6ec" stroke="#2f8a4b"/><text x="424" y="542" font-weight="600" fill="#1a1a1a">Active</text><text x="424" y="560" fill="#555">paid or included</text>
    <rect x="524" y="520" width="140" height="52" rx="8" fill="#fff6e5" stroke="#c98a12"/><text x="594" y="542" font-weight="600" fill="#1a1a1a">Grace</text><text x="594" y="560" fill="#555">14 days, still running</text>
    <rect x="694" y="520" width="170" height="52" rx="8" fill="#fdecec" stroke="#c0392b"/><text x="779" y="542" font-weight="600" fill="#1a1a1a">Read-only</text><text x="779" y="560" fill="#555">nothing faces customers</text>
  </g>
  <text x="594" y="626" text-anchor="middle" font-size="12" fill="#555">subscribe again: everything resumes where it stopped</text>
  <path d="M254 520C254 498 594 498 594 516" stroke="#999" stroke-width="1.5" stroke-dasharray="4 3" fill="none" marker-end="url(#a)"/>
  <text x="424" y="496" text-anchor="middle" font-size="11" fill="#777">trial ends unpaid</text>
</svg>

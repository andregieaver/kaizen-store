name: CI

on:
  push:
    branches: [main]
  pull_request:
  # One-time: record the migrations production already has (docs/ci-migrations.md). Run from main.
  workflow_dispatch:
    inputs:
      baseline_through:
        description: "Last migration file production already has (records it and every earlier file as applied, runs nothing)"
        required: false
      redeploy:
        description: "Deploy the head of main to production through the Vercel deploy hook, without running the checks"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  # A newer push cancels a running check on a pull request, but never a run on main:
  # that run may be in the middle of applying a migration to production.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    # The whole job (lint, types, unit, integration, build, e2e) takes about 25 minutes; 20 cut it off in the e2e step.
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Migrations match the schema
        run: pnpm db:check
      - name: Create the database with the demo catalogue
        run: node scripts/db-setup.mjs --seed
      - name: Integration tests against the database
        run: pnpm test:int
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  # Stores on their own hosts (P7) and their own code (D61) exist only in a
  # build with the store domain set; stores run on *.localhost here.
  hosts:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      NEXT_PUBLIC_STORE_DOMAIN: localhost:3000
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create the database with the demo catalogue and a store on a domain of its own
        run: node scripts/db-setup.mjs --seed && node e2e/hosts-seed.mjs
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test e2e/store-hosts.spec.ts
        env:
          E2E_CUSTOM_HOSTS: "1"

  # Production's migrations (docs/ci-migrations.md): on a push to main, after the checks pass, apply the
  # migration files production has not had yet. Off until the repository variable AUTO_MIGRATE is "true".
  # PRODUCTION_DATABASE_URL is the Supabase session-pooler connection string of the postgres role.
  migrate:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AUTO_MIGRATE == 'true'
    needs: [check]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      MIGRATE_EXPECT: ybsozesfuxuitoacntfo
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply the pending migrations
        run: node scripts/db-migrate.mjs
      - name: Nothing is left pending
        run: node scripts/db-migrate.mjs --status

  # Production's deploy (docs/ci-migrations.md): Vercel's own build of main is switched off in vercel.json, so
  # production gets new code only here: after the checks, and after the migrations when there were any, so
  # new code never runs against the old schema. A failed check or migration deploys nothing. Off until the
  # repository variable DEPLOY_VIA_CI is "true" (set it before vercel.json turns Vercel's own deploy off).
  deploy:
    if: >-
      always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_VIA_CI == 'true'
      && needs.check.result == 'success' && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped')
    needs: [check, migrate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ask Vercel to deploy the head of main
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          test -n "$VERCEL_DEPLOY_HOOK_URL" || { echo "The secret VERCEL_DEPLOY_HOOK_URL is not set."; exit 1; }
          curl --fail --silent --show-error --max-time 30 -X POST "$VERCEL_DEPLOY_HOOK_URL"
          echo

  # Manual: deploy again (to test the hook, or after a failed deploy) without running anything else.
  redeploy:
    if: github.event_name == 'workflow_dispatch' && inputs.redeploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ask Vercel to deploy the head of main
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          test -n "$VERCEL_DEPLOY_HOOK_URL" || { echo "The secret VERCEL_DEPLOY_HOOK_URL is not set."; exit 1; }
          curl --fail --silent --show-error --max-time 30 -X POST "$VERCEL_DEPLOY_HOOK_URL"
          echo

  baseline:
    if: github.event_name == 'workflow_dispatch' && inputs.baseline_through != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      MIGRATE_EXPECT: ybsozesfuxuitoacntfo
      BASELINE_THROUGH: ${{ inputs.baseline_through }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Record the migrations production already has
        run: node scripts/db-migrate.mjs --baseline-through="$BASELINE_THROUGH" --status

name: CI

on:
  push:
    branches: [main]
    # Words only: nothing to test or deploy. (docs/parity/*.json and the generated docs/shopify-parity.md are
    # read by the unit tests, so `pnpm test` before pushing those; a push of them alone is not run here.)
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
  # One-time: record the migrations production already has (docs/ci-migrations.md). Run from main.
  workflow_dispatch:
    inputs:
      baseline_through:
        description: "Last migration file production already has (records it and every earlier file as applied, runs nothing)"
        required: false
      redeploy:
        description: "Deploy the head of main to production through the Vercel deploy hook, without running the checks"
        type: boolean
        default: false

concurrency:
  # A newer push cancels a running check on a pull request. A run on main is never cancelled (it may be in the
  # middle of applying a migration to production) and never waits for another: each has a group of its own, so a
  # push that needs no migration deploys at once, whatever the run before it is still checking.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The checks run side by side (about 10 minutes once a runner is free). Every job below is one runner to wait for
  # when GitHub's queue is long, so the gate is these three jobs themselves (`release` needs them) and not a
  # fourth job that sums them up.
  static:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  integration:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migrations match the schema
        run: pnpm db:check
      - name: Create the database with the demo catalogue
        run: node scripts/db-setup.mjs --seed
      - name: Integration tests against the database
        run: pnpm test:int

  e2e:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create the database with the demo catalogue
        run: node scripts/db-setup.mjs --seed
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  # Stores on their own hosts (P7) and their own code (D61) exist only in a
  # build with the store domain set; stores run on *.localhost here.
  hosts:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      NEXT_PUBLIC_STORE_DOMAIN: localhost:3000
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create the database with the demo catalogue and a store on a domain of its own
        run: node scripts/db-setup.mjs --seed && node e2e/hosts-seed.mjs
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test e2e/store-hosts.spec.ts
        env:
          E2E_CUSTOM_HOSTS: "1"

  # Production's migrations and deploy (docs/ci-migrations.md). Vercel's own build of main is switched off in
  # vercel.json, so production gets new code only here. Whether a push has migrations is read from production's
  # ledger: files in this commit it has not recorded. Off until the repository variables AUTO_MIGRATE and
  # DEPLOY_VIA_CI are "true". PRODUCTION_DATABASE_URL is the Supabase session-pooler connection string of the
  # postgres role. Two jobs, so a push waits for at most two runners:
  #
  #   no pending migration:  `pending` reads the ledger and asks for the deploy in the same job, at once (the
  #                          checks run beside it and report; they do not hold it back)
  #   pending migration:     `release` waits for static, integration and e2e, applies the files, then deploys,
  #                          so new code never meets the old schema and a failed check or migration deploys
  #                          nothing
  pending:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AUTO_MIGRATE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      pending: ${{ steps.status.outputs.pending }}
    env:
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      MIGRATE_EXPECT: ybsozesfuxuitoacntfo
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Which migrations has production not had?
        id: status
        run: node scripts/db-migrate.mjs --status
      - name: No migration to apply, so ask Vercel to deploy the head of main now
        if: steps.status.outputs.pending == 'false' && vars.DEPLOY_VIA_CI == 'true'
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          test -n "$VERCEL_DEPLOY_HOOK_URL" || { echo "The secret VERCEL_DEPLOY_HOOK_URL is not set."; exit 1; }
          curl --fail --silent --show-error --max-time 30 -X POST "$VERCEL_DEPLOY_HOOK_URL"
          echo

  # Migrations were pending (or AUTO_MIGRATE is off): after the three checks, apply the files, then deploy, in one
  # job. A failed check, a failed migration or a status that could not be read deploys nothing. Re-running a
  # failed run's jobs is safe: the files are in the ledger by then, so the migration step has nothing to do and
  # the deploy is asked for again. (With AUTO_MIGRATE off, `pending` is skipped and this job only deploys; the
  # environment `production` then applies to that deploy too.)
  release:
    if: >-
      always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
      && (vars.AUTO_MIGRATE == 'true' || vars.DEPLOY_VIA_CI == 'true')
      && needs.pending.outputs.pending != 'false'
      && (needs.pending.result == 'success' || needs.pending.result == 'skipped')
      && needs.static.result == 'success' && needs.integration.result == 'success' && needs.e2e.result == 'success'
    needs: [pending, static, integration, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      MIGRATE_EXPECT: ybsozesfuxuitoacntfo
    steps:
      - uses: actions/checkout@v5
        if: needs.pending.outputs.pending == 'true'
      - uses: pnpm/action-setup@v4
        if: needs.pending.outputs.pending == 'true'
      - uses: actions/setup-node@v5
        if: needs.pending.outputs.pending == 'true'
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: needs.pending.outputs.pending == 'true'
      - name: Apply the pending migrations
        if: needs.pending.outputs.pending == 'true'
        run: node scripts/db-migrate.mjs
      - name: Nothing is left pending
        if: needs.pending.outputs.pending == 'true'
        run: node scripts/db-migrate.mjs --status
      - name: Ask Vercel to deploy the head of main
        if: vars.DEPLOY_VIA_CI == 'true'
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          test -n "$VERCEL_DEPLOY_HOOK_URL" || { echo "The secret VERCEL_DEPLOY_HOOK_URL is not set."; exit 1; }
          curl --fail --silent --show-error --max-time 30 -X POST "$VERCEL_DEPLOY_HOOK_URL"
          echo

  # Manual: deploy again (to test the hook, or after a failed deploy) without running anything else.
  redeploy:
    if: github.event_name == 'workflow_dispatch' && inputs.redeploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ask Vercel to deploy the head of main
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          test -n "$VERCEL_DEPLOY_HOOK_URL" || { echo "The secret VERCEL_DEPLOY_HOOK_URL is not set."; exit 1; }
          curl --fail --silent --show-error --max-time 30 -X POST "$VERCEL_DEPLOY_HOOK_URL"
          echo

  baseline:
    if: github.event_name == 'workflow_dispatch' && inputs.baseline_through != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      MIGRATE_EXPECT: ybsozesfuxuitoacntfo
      BASELINE_THROUGH: ${{ inputs.baseline_through }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Record the migrations production already has
        run: node scripts/db-migrate.mjs --baseline-through="$BASELINE_THROUGH" --status

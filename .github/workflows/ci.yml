name: CI

on:
  push:
    branches: [main]
    # Words only: nothing to test or deploy. (docs/parity/*.json and the generated docs/shopify-parity.md are
    # read by the unit tests, so `pnpm test` before pushing those; a push of them alone is not run here.) The docs
    # portal's articles (D442, content/**) are Markdown too, but they are the product: checked by the unit tests and
    # built into the deployment, so a push of them is run (a later positive pattern takes a path back in).
    # The written rules have a check of their own that runs for these pushes too: docs-budget.yml.
    paths:
      - "**"
      - "!**/*.md"
      - "!docs/**"
      - "content/**"
  pull_request:
  # One-time: record the migrations production already has (docs/ci-migrations.md). Run from main.
  workflow_dispatch:
    inputs:
      baseline_through:
        description: "Last migration file production already has (records it and every earlier file as applied, runs nothing)"
        required: false
      redeploy:
        description: "Deploy the head of main to production through the Vercel deploy hook, without running the checks"
        type: boolean
        default: false
      prebuilt_trial:
        description: "Build this commit on the runner with vercel build and deploy it prebuilt as a PREVIEW (bloat review step 1.29); production is not touched"
        type: boolean
        default: false

concurrency:
  # A newer push cancels a running check on a pull request. A run on main is never cancelled (it may be in the
  # middle of applying a migration to production) and never waits for another: each has a group of its own, so a
  # push that needs no migration deploys at once, whatever the run before it is still checking.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


# The type check of the whole program and the build need more than Node's default heap (D312); the catalogues alone take about 125 MB.
env:
  NODE_OPTIONS: --max-old-space-size=7168
  # Every check runs through scripts/timed.mjs (bloat review step 1.20), which appends its seconds here; each job uploads the file.
  TIMINGS_FILE: timings.jsonl

jobs:
  # The checks run side by side (about 10 minutes once a runner is free). Every job below is one runner to wait for
  # when GitHub's queue is long, so the gate is these jobs themselves (`release` needs every one of them: static,
  # integration, e2e, hosts, signed-in and audit, D526) and not another job that sums them up.
  static:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: node scripts/timed.mjs install-static -- pnpm install --frozen-lockfile
      # Lint's cache (src/lib/ci-once.scan.test.ts): results are kept by each file's content, so a fresh checkout reuses them.
      - uses: actions/cache@v6
        with:
          path: node_modules/.cache/eslint
          key: eslint-${{ hashFiles('pnpm-lock.yaml', 'eslint.config.mjs') }}-${{ github.sha }}
          restore-keys: |
            eslint-${{ hashFiles('pnpm-lock.yaml', 'eslint.config.mjs') }}-
      - run: node scripts/timed.mjs lint -- pnpm lint
      - run: node scripts/timed.mjs typecheck --warm-if=tsconfig.tsbuildinfo -- pnpm typecheck
      # A one-week trial of bloat review step 2.42, until 25 November 2026: the native TypeScript 7 compiler (fetched for this step only, never installed in the project) checks the same program beside tsc,
      # and its errors are kept to compare with tsc's. It cannot fail the job and has no ceiling in scripts/ci-budgets.json (recorded, not held).
      - name: "Trial: native type check (does not fail the job)"
        continue-on-error: true
        run: node scripts/timed.mjs typecheck-native -- bash -o pipefail -c 'pnpm dlx typescript@7.0.2 --noEmit -p tsconfig.json 2>&1 | tee typecheck-native.txt'
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: typecheck-native
          path: typecheck-native.txt
          retention-days: 14
          if-no-files-found: ignore
      - run: node scripts/timed.mjs unit --unit -- pnpm test --reporter=default --reporter=json --outputFile=.vitest-report.json
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: timings-static
          path: timings.jsonl
          retention-days: 7
          if-no-files-found: ignore

  # Known advisories in what production runs (PSI 2026-10-24, SEC-08). In `release`'s `needs` (PSI 2026-10-31): a high advisory
  # holds back a migration and the deploy that follows it; a push without a migration still deploys after its quick gate and shows it red here.
  # Dependabot (`.github/dependabot.yml`) proposes the updates.
  audit:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      # No install: the audit reads the lockfile, so there is no pnpm store to cache. setup-node v5 caches on its own when
      # package.json names a package manager, and its cleanup then fails on the missing store, so that is switched off.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - run: pnpm audit --prod --audit-level high

  integration:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The files run one at a time against one database, so the suite is cut in shards, each with a database of its own
    # (the whole suite passed 30 minutes on 29 October 2026, run 741).
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: node scripts/timed.mjs install-int-${{ matrix.shard }} -- pnpm install --frozen-lockfile
      # It reads only the repository, so one shard is enough.
      - name: Migrations match the schema
        if: matrix.shard == 1
        run: pnpm db:check
      - name: Create the database with the demo catalogue
        run: node scripts/db-setup.mjs --seed
      - name: Query budget on the fresh database (src/server/query-budget.int.test.ts)
        if: matrix.shard == 1
        run: node scripts/timed.mjs query-budget -- pnpm exec vitest run --config vitest.integration.config.mts src/server/query-budget.int.test.ts
      - name: Integration tests against the database
        run: node scripts/timed.mjs int-${{ matrix.shard }} -- pnpm test:int --shard=${{ matrix.shard }}/3 --exclude src/server/query-budget.int.test.ts
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: timings-int-${{ matrix.shard }}
          path: timings.jsonl
          retention-days: 7
          if-no-files-found: ignore

  e2e:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    # 40: on 18 November the job took 24 and 26 minutes, and a runner 20 % slower ran out of 30 in the step after Playwright (CI #44383014848).
    timeout-minutes: 40
    # Playwright's own image: Chromium, WebKit and every library they need are in it. Installing WebKit's on the runner
    # meant 181 packages (114 MB) from the Ubuntu mirror, which twice on 4 November 2026 came so slowly that the job ran
    # out of time before a test ran (CI #979, #981). Its tag is the pinned @playwright/test version
    # (src/lib/ci-playwright.scan.test.ts). Root in the container: Playwright runs Chromium without its sandbox anyway.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # From inside the job's container the database is the service's name, not localhost.
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/postgres
      # The runner's clock zone, which the tests have always run in (the image was built with another as a build argument).
      TZ: UTC
      # The build skips its own type check: `static` and the quick gate check the same project (src/lib/ci-once.scan.test.ts).
      SKIP_BUILD_TYPECHECK: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: node scripts/timed.mjs install-e2e -- pnpm install --frozen-lockfile
      - name: Create the database with the demo catalogue
        run: node scripts/db-setup.mjs --seed
      # Before the build: stores' pages are prerendered from the database (bloat review step 1.6, e2e/performance.spec.ts holds its pages).
      - name: Seed a store on the Orbit theme (e2e/seed/themed-store.seed.ts)
        run: pnpm seed:themed
      - run: node scripts/timed.mjs build-e2e -- pnpm build
      # The megabytes traced beside each function and what carries them (bloat review step 1.8, scripts/trace-budgets.json): a breach fails the job with the figure.
      - name: What a function carries
        run: node scripts/timed.mjs trace-sizes -- node scripts/trace-sizes.mjs --check >> "$GITHUB_STEP_SUMMARY"
      # What each kind of route lists at start, the server-reference manifest, the routing rules and the cold loads (bloat review step 1.8, scripts/route-budget.json).
      - name: What a route loads
        run: node scripts/timed.mjs route-budget -- node scripts/route-budget.mjs >> "$GITHUB_STEP_SUMMARY"
      # Each built route and page loads in a fresh process, as a cold Vercel function loads it (bloat review step 0.6): a lazy
      # import changes load order, and a route that first loads a module of an import cycle can fail while the same code loads
      # fine behind another route (the Mollie webhook, 12 November 2026). A server that has answered other requests hides that.
      - name: Every built route loads on its own
        run: node scripts/timed.mjs cold-loads -- node scripts/cold-load-routes.mjs
      # Which routes are static, how many holes each has and what the demo store's resume data keeps (bloat review step 1.11): a hard
      # gate, so a new cookies() or headers() read in a shared part fails here and not in a visitor's first load.
      - name: What is static
        run: node scripts/timed.mjs render-modes -- node scripts/render-modes.mjs >> "$GITHUB_STEP_SUMMARY"
      # Whose classes the one stylesheet holds (bloat review step 1.23): it fails above the two lines in the script, and its table is the summary.
      - name: Whose classes the stylesheet holds
        shell: bash
        run: |
          set -o pipefail
          node scripts/timed.mjs stylesheet-audiences -- node docs/audits/bloat-review-2026-11/scripts/stylesheet-audiences.mjs | tee -a "$GITHUB_STEP_SUMMARY"
      # WebKit too: the shopper's pages also run in Safari's engine (playwright.config.ts, the webkit project; PSI UX-12).
      # The image has both browsers, so this finds them and does nothing; were the pinned version ever ahead of the
      # image, it would fetch the browsers from Playwright's own servers, never the Ubuntu mirror (no --with-deps).
      - run: pnpm exec playwright install chromium webkit
      - run: node scripts/timed.mjs e2e --playwright-report=playwright-report.json -- pnpm test:e2e
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-report.json
      # The statements each store page sends, counted from the app's own statement log (bloat review step 1.11): after Playwright, so
      # nothing else sends statements, and `success()` so a red Playwright run is not hidden behind it. A hard gate.
      - name: Statements per store page
        if: success()
        run: node scripts/timed.mjs server-budget -- node scripts/server-budget.mjs >> "$GITHUB_STEP_SUMMARY"
      # After the end-to-end run, so a budget failure never hides its results; `!cancelled()` so it still reports when a test failed.
      - name: Every route's first scripts against the baseline (scripts/bundle-budget.mjs)
        if: ${{ !cancelled() }}
        run: node scripts/timed.mjs bundle-budget -- node scripts/bundle-budget.mjs
      # What failed, kept for a week: each failed test's page snapshot and its retry's trace (playwright.config.ts), read with
      # `pnpm exec playwright show-trace`. Without them a failure that does not come back locally cannot be read.
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: timings-e2e
          path: timings.jsonl
          retention-days: 7
          if-no-files-found: ignore

  # Stores on their own hosts (P7) and their own code (D61) exist only in a
  # build with the store domain set; stores run on *.localhost here.
  hosts:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # In Playwright's image, as the e2e job: Chromium and its libraries come with it, so no apt mirror can hold the job up.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/postgres
      TZ: UTC
      NEXT_PUBLIC_STORE_DOMAIN: localhost:3000
      # The theme store on its own host, a name under the store domain (docs/theme-phase-3.md step 3).
      NEXT_PUBLIC_THEMES_HOST: themes.localhost:3000
      # The docs on their own host (D442), likewise a name under the store domain that must never be taken for a store's.
      NEXT_PUBLIC_DOCS_HOST: docs.localhost:3000
      # The build skips its own type check: `static` and the quick gate check the same project (src/lib/ci-once.scan.test.ts).
      SKIP_BUILD_TYPECHECK: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: node scripts/timed.mjs install-hosts -- pnpm install --frozen-lockfile
      - name: Create the database with the demo catalogue, a store on a domain of its own, and Kaizena Flow's site served from its store
        run: node scripts/db-setup.mjs --seed && node e2e/hosts-seed.mjs
      - run: node scripts/timed.mjs build-hosts -- pnpm build
      - run: pnpm exec playwright install chromium
      - run: node scripts/timed.mjs hosts --playwright-report=playwright-report.json -- pnpm exec playwright test e2e/store-hosts.spec.ts e2e/inline-edit-hosts.spec.ts e2e/theme-host.spec.ts e2e/docs-host.spec.ts e2e/house-site.spec.ts
        env:
          E2E_CUSTOM_HOSTS: "1"
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-report.json
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: timings-hosts
          path: timings.jsonl
          retention-days: 7
          if-no-files-found: ignore

  # The admin as signed-in people see it (e2e/signed-in/): the app is built against a stand-in for Supabase Auth
  # (e2e/fixtures/auth-stub.mjs), so its own sign-in form, session check and permissions run unchanged; an owner and a
  # Read-only member are signed in by e2e/signed-in/auth.setup.ts.
  signed-in:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # In Playwright's image, as the e2e job: Chromium and its libraries come with it, so no apt mirror can hold the job up.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/postgres
      TZ: UTC
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:3912
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: e2e-publishable-key
      E2E_SIGNED_IN: "1"
      # The build skips its own type check: `static` and the quick gate check the same project (src/lib/ci-once.scan.test.ts).
      SKIP_BUILD_TYPECHECK: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: node scripts/timed.mjs install-signed-in -- pnpm install --frozen-lockfile
      - name: Create the database with the demo catalogue
        run: node scripts/db-setup.mjs --seed
      - run: node scripts/timed.mjs build-signed-in -- pnpm build
      - run: pnpm exec playwright install chromium
      - run: node scripts/timed.mjs signed-in --playwright-report=playwright-report.json -- pnpm exec playwright test --project=signed-in
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-report.json
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: signed-in-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: timings-signed-in
          path: timings.jsonl
          retention-days: 7
          if-no-files-found: ignore

  # Production's migrations and deploy (docs/ci-migrations.md). Vercel's own build of main is switched off in
  # vercel.json, so production gets new code only here. Whether a push has migrations is read from production's
  # ledger: files in this commit it has not recorded. Off until the repository variables AUTO_MIGRATE and
  # DEPLOY_VIA_CI are "true". PRODUCTION_DATABASE_URL is the Supabase session-pooler connection string of the
  # postgres role. Two jobs, so a push waits for at most two runners:
  #
  #   no pending migration:  `pending` reads the ledger, runs the quick gate (lint, the type check and the money
  #                          tests, D526: minutes, in this same job so there is no second runner to wait for)
  #                          and then asks for the deploy (a push that changes only tests is checked and not
  #                          deployed, scripts/deploy-needed.mjs). The full checks run beside it and report; they
  #                          do not hold it back
  #   pending migration:     `release` waits for every check (static, integration, e2e, hosts, signed-in and
  #                          audit), applies the files, then deploys, so new code never meets the old schema
  #                          and a failed check or migration deploys nothing
  pending:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AUTO_MIGRATE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # D741: the fallback reads newer CI runs.
    permissions:
      contents: read
      actions: read
    outputs:
      pending: ${{ steps.status.outputs.pending }}
    env:
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      MIGRATE_EXPECT: ybsozesfuxuitoacntfo
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: node scripts/timed.mjs install-pending -- pnpm install --frozen-lockfile
      # Lint's cache (src/lib/ci-once.scan.test.ts): results are kept by each file's content, so a fresh checkout reuses them.
      - uses: actions/cache@v6
        with:
          path: node_modules/.cache/eslint
          key: eslint-${{ hashFiles('pnpm-lock.yaml', 'eslint.config.mjs') }}-${{ github.sha }}
          restore-keys: |
            eslint-${{ hashFiles('pnpm-lock.yaml', 'eslint.config.mjs') }}-
      - name: Which migrations has production not had?
        id: status
        run: node scripts/db-migrate.mjs --status
      # The quick gate (D526, code review FH1). Vercel's build skips the type check (D378), so without this a push
      # with a type error, a lint error or broken money arithmetic was live before any check had finished. A
      # failure here deploys nothing: production stays on the commit it has. Skipped when a migration is pending:
      # `release` then waits for the whole of `static`, which runs the same three and more.
      - name: "Quick gate: lint"
        if: steps.status.outputs.pending == 'false' && vars.DEPLOY_VIA_CI == 'true'
        run: node scripts/timed.mjs gate-lint -- pnpm lint
      - name: "Quick gate: type check"
        if: steps.status.outputs.pending == 'false' && vars.DEPLOY_VIA_CI == 'true'
        run: node scripts/timed.mjs gate-typecheck --warm-if=tsconfig.tsbuildinfo -- pnpm typecheck
      - name: "Quick gate: money, cart, checkout and VAT tests"
        if: steps.status.outputs.pending == 'false' && vars.DEPLOY_VIA_CI == 'true'
        run: node scripts/timed.mjs gate-smoke -- pnpm test:smoke
      # The deploy hook builds the head of main at the moment it is called, not this commit (D530). A later push may have
      # brought a migration that production has not had: deploying the head then puts new code on the old schema (it
      # happened on 10 November 2026). So the ledger is read again against the head's files just before the call, and
      # a head with a pending migration is left to its own run's `release`.
      - name: Is a migration pending at the head of main by now?
        id: head
        if: steps.status.outputs.pending == 'false' && vars.DEPLOY_VIA_CI == 'true'
        run: |
          git fetch --depth=1 origin main
          git checkout FETCH_HEAD -- supabase/migrations
          node scripts/db-migrate.mjs --status
      # Several pushes within minutes each reach the hook, and each call builds the same head (D710: three builds of 61dcec1 on
      # 17 November 2026). A run whose commit is no longer the head leaves the hook and the wait to the newer push's run, whose
      # deployment includes this commit; a newer commit of words only starts no run, so it does not count.
      - name: Will a newer push's run deploy instead?
        id: newer
        if: steps.status.outputs.pending == 'false' && vars.DEPLOY_VIA_CI == 'true' && steps.head.outputs.pending == 'false'
        run: HEAD_SHA="$(git rev-parse FETCH_HEAD)" node scripts/newer-push.mjs
      # A push that changes only tests cannot change the deployed app: it is checked above and not deployed (bloat review
      # step 0.38). Decided against what production runs, so a tests-only push after a failed deploy still deploys.
      - name: Does this push change what is deployed?
        id: changed
        if: steps.status.outputs.pending == 'false' && vars.DEPLOY_VIA_CI == 'true' && steps.head.outputs.pending == 'false'
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL || 'https://kaizenaflow.com' }}
        run: node scripts/deploy-needed.mjs
      - name: No migration to apply and the quick gate passed, so ask Vercel to deploy the head of main now
        if: steps.status.outputs.pending == 'false' && vars.DEPLOY_VIA_CI == 'true' && steps.head.outputs.pending == 'false' && steps.changed.outputs.deploy != 'false' && steps.newer.outputs.newer != 'true'
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          test -n "$VERCEL_DEPLOY_HOOK_URL" || { echo "The secret VERCEL_DEPLOY_HOOK_URL is not set."; exit 1; }
          # A busy Vercel answers 429: wait as it asks (Retry-After) and try again, up to five minutes.
          curl --fail --silent --show-error --max-time 30 --retry 6 --retry-max-time 300 -X POST "$VERCEL_DEPLOY_HOOK_URL"
          echo
      - name: Wait until production runs this commit
        if: steps.status.outputs.pending == 'false' && vars.DEPLOY_VIA_CI == 'true' && steps.head.outputs.pending == 'false' && steps.changed.outputs.deploy != 'false' && steps.newer.outputs.newer != 'true'
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL || 'https://kaizenaflow.com' }}
          SMOKE_PAGES: ${{ vars.SMOKE_PAGES || '/,/s/demo/no' }}
          PUSHED_AT: ${{ github.event.head_commit.timestamp }}
        # The deploy is verified (D389): /api/health reports the deployment's commit; a later push's deployment that includes it counts.
        run: node scripts/await-deploy.mjs
      # D741: a run that left its deploy to a newer run (D710), or to the head's release because the head has a migration, makes sure it happens. It waits while newer runs go on; when they have all
      # finished and production still lacks this commit (run 1545 failed after 1544 left it the deploy, 17 November 2026), it deploys
      # THIS commit through Vercel's API (the hook would build the failing head), or fails here saying so when VERCEL_TOKEN is not set.
      - name: A newer run was to deploy, so make sure production gets this commit
        id: fallback
        if: steps.status.outputs.pending == 'false' && vars.DEPLOY_VIA_CI == 'true' && steps.changed.outputs.deploy != 'false' && (steps.head.outputs.pending == 'true' || steps.newer.outputs.newer == 'true')
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL || 'https://kaizenaflow.com' }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          FALLBACK_WAIT_SECONDS: "2400"
        run: node scripts/deploy-fallback.mjs
      - name: Wait until production runs the commit this run deployed
        if: steps.fallback.outputs.deployed == 'true'
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL || 'https://kaizenaflow.com' }}
          SMOKE_PAGES: ${{ vars.SMOKE_PAGES || '/,/s/demo/no' }}
        run: node scripts/await-deploy.mjs
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: timings-pending
          path: timings.jsonl
          retention-days: 7
          if-no-files-found: ignore

  # Migrations were pending (or AUTO_MIGRATE is off): after every check, apply the files, then deploy, in one
  # job. A failed check, a failed migration or a status that could not be read deploys nothing. Re-running a
  # failed run's jobs is safe: the files are in the ledger by then, so the migration step has nothing to do and
  # the deploy is asked for again. (With AUTO_MIGRATE off, `pending` is skipped and this job only deploys; the
  # environment `production` then applies to that deploy too.)
  release:
    if: >-
      always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
      && (vars.AUTO_MIGRATE == 'true' || vars.DEPLOY_VIA_CI == 'true')
      && needs.pending.outputs.pending != 'false'
      && (needs.pending.result == 'success' || needs.pending.result == 'skipped')
      && needs.static.result == 'success' && needs.integration.result == 'success' && needs.e2e.result == 'success'
      && needs.hosts.result == 'success' && needs.signed-in.result == 'success'
      && needs.audit.result == 'success'
    needs: [pending, static, integration, e2e, hosts, signed-in, audit]
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment: production
    # D741: the fallback reads newer CI runs.
    permissions:
      contents: read
      actions: read
    env:
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      MIGRATE_EXPECT: ybsozesfuxuitoacntfo
    steps:
      # Checked out for the deploy's wait too (D389).
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        if: needs.pending.outputs.pending == 'true'
      - uses: actions/setup-node@v7
        if: needs.pending.outputs.pending == 'true'
        with:
          node-version: 22
          cache: pnpm
      - run: node scripts/timed.mjs install-release -- pnpm install --frozen-lockfile
        if: needs.pending.outputs.pending == 'true'
      - name: Apply the pending migrations
        if: needs.pending.outputs.pending == 'true'
        run: node scripts/db-migrate.mjs
      - name: Nothing is left pending
        if: needs.pending.outputs.pending == 'true'
        run: node scripts/db-migrate.mjs --status
      # The deploy hook builds the head of main at the moment it is called, not this commit (D530). A later push may have
      # brought a migration that production has not had: deploying the head then puts new code on the old schema (it
      # happened on 10 November 2026). So the ledger is read again against the head's files just before the call, and
      # a head with a pending migration is left to its own run's `release`.
      - name: Is a migration pending at the head of main by now?
        id: head
        if: vars.DEPLOY_VIA_CI == 'true' && needs.pending.outputs.pending == 'true'
        run: |
          git fetch --depth=1 origin main
          git checkout FETCH_HEAD -- supabase/migrations
          node scripts/db-migrate.mjs --status
      # As in `pending` (D710): a newer push's run deploys the head, this commit with it.
      - name: Will a newer push's run deploy instead?
        id: newer
        if: vars.DEPLOY_VIA_CI == 'true' && needs.pending.outputs.pending == 'true' && steps.head.outputs.pending != 'true'
        run: HEAD_SHA="$(git rev-parse FETCH_HEAD)" node scripts/newer-push.mjs
      - name: Ask Vercel to deploy the head of main
        if: vars.DEPLOY_VIA_CI == 'true' && steps.head.outputs.pending != 'true' && steps.newer.outputs.newer != 'true'
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          test -n "$VERCEL_DEPLOY_HOOK_URL" || { echo "The secret VERCEL_DEPLOY_HOOK_URL is not set."; exit 1; }
          # A busy Vercel answers 429: wait as it asks (Retry-After) and try again, up to five minutes.
          curl --fail --silent --show-error --max-time 30 --retry 6 --retry-max-time 300 -X POST "$VERCEL_DEPLOY_HOOK_URL"
          echo
      - name: Wait until production runs this commit
        if: vars.DEPLOY_VIA_CI == 'true' && steps.head.outputs.pending != 'true' && steps.newer.outputs.newer != 'true'
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL || 'https://kaizenaflow.com' }}
          SMOKE_PAGES: ${{ vars.SMOKE_PAGES || '/,/s/demo/no' }}
          PUSHED_AT: ${{ github.event.head_commit.timestamp }}
        # The deploy is verified (D389): /api/health reports the deployment's commit; a later push's deployment that includes it counts.
        run: node scripts/await-deploy.mjs
      # D741, as in `pending` (run 1551 applied its migrations and left the deploy to the head's release): this commit's migrations are applied, so its code may go out on its own.
      # D793: once the wait is over it deploys this commit unless a newer run is deploying, rather than fail while newer runs go on.
      - name: A newer run was to deploy, so make sure production gets this commit
        id: fallback
        if: vars.DEPLOY_VIA_CI == 'true' && needs.pending.outputs.pending == 'true' && (steps.head.outputs.pending == 'true' || steps.newer.outputs.newer == 'true')
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL || 'https://kaizenaflow.com' }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          FALLBACK_WAIT_SECONDS: "1800"
        run: node scripts/deploy-fallback.mjs
      - name: Wait until production runs the commit this run deployed
        if: steps.fallback.outputs.deployed == 'true'
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL || 'https://kaizenaflow.com' }}
          SMOKE_PAGES: ${{ vars.SMOKE_PAGES || '/,/s/demo/no' }}
        run: node scripts/await-deploy.mjs
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: timings-release
          path: timings.jsonl
          retention-days: 7
          if-no-files-found: ignore

  # Manual: deploy again (to test the hook, or after a failed deploy) without running anything else.
  redeploy:
    if: github.event_name == 'workflow_dispatch' && inputs.redeploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Ask Vercel to deploy the head of main
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          test -n "$VERCEL_DEPLOY_HOOK_URL" || { echo "The secret VERCEL_DEPLOY_HOOK_URL is not set."; exit 1; }
          # A busy Vercel answers 429: wait as it asks (Retry-After) and try again, up to five minutes.
          curl --fail --silent --show-error --max-time 30 --retry 6 --retry-max-time 300 -X POST "$VERCEL_DEPLOY_HOOK_URL"
          echo
      - name: Wait until production runs this commit
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL || 'https://kaizenaflow.com' }}
          SMOKE_PAGES: ${{ vars.SMOKE_PAGES || '/,/s/demo/no' }}
          PUSHED_AT: ${{ github.event.head_commit.timestamp }}
        # The deploy is verified (D389): /api/health reports the deployment's commit; a later push's deployment that includes it counts.
        run: node scripts/await-deploy.mjs

  # Manual, preview only (bloat review step 1.29, docs/build-memory.md): the runner's size, then this commit built with `vercel build` and
  # deployed prebuilt as a preview, whose /api/health goes to the summary (its commit from build-stats.json and the build's peak). Needs the
  # secrets VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID. `vercel pull` writes the environment's settings into .vercel/: never print it,
  # upload it or cache it.
  prebuilt-trial:
    if: github.event_name == 'workflow_dispatch' && inputs.prebuilt_trial
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: node scripts/timed.mjs install-trial -- pnpm install --frozen-lockfile
      - name: The runner's cores and memory
        run: |
          { echo '### Runner'; echo '```'; nproc; free -g; cat /sys/fs/cgroup/memory.max 2>/dev/null || true; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: The preview environment's settings
        run: node scripts/timed.mjs trial-pull -- pnpm dlx vercel@65 pull --yes --environment=preview --token="$VERCEL_TOKEN"
      - name: Build this commit as Vercel would
        run: node scripts/timed.mjs trial-build -- pnpm dlx vercel@65 build --token="$VERCEL_TOKEN"
      # The recorder prints its own line to stdout, so the URL is written inside the command it times.
      - name: Deploy the prebuilt output as a preview
        run: node scripts/timed.mjs trial-deploy -- sh -c 'pnpm dlx vercel@65 deploy --prebuilt --token="$VERCEL_TOKEN" > deployment-url.txt'
      - name: What the preview reports
        run: |
          { echo '### Preview /api/health'; echo '```json'; curl -s "$(cat deployment-url.txt)/api/health"; echo; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: timings-prebuilt-trial
          path: timings.jsonl
          retention-days: 7
          if-no-files-found: ignore

  # Every job's seconds, added up as runner minutes (bloat review step 1.20, scripts/runner-minutes.mjs), and each job's install seconds from
  # the timings it uploaded. After every other check of a push, red or green; it reads the run's own jobs and writes nothing.
  timings:
    if: always() && github.event_name != 'workflow_dispatch'
    needs: [static, audit, integration, e2e, hosts, signed-in]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Runner minutes of this push
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/runner-minutes.mjs >> "$GITHUB_STEP_SUMMARY"

  # Who turned main red (scripts/main-health.mjs): after every check of a push to main, the newest finished run keeps one open issue
  # labelled `ci-red` naming the failing tests and the commits (and Claude sessions) since the last green run, and closes it once green.
  # Many sessions push at once; this is how the one whose commit broke a check hears of it. It never fails the run.
  main-health:
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [pending, static, audit, integration, e2e, hosts, signed-in]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Keep the ci-red issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/main-health.mjs >> "$GITHUB_STEP_SUMMARY"

  baseline:
    if: github.event_name == 'workflow_dispatch' && inputs.baseline_through != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      MIGRATE_EXPECT: ybsozesfuxuitoacntfo
      BASELINE_THROUGH: ${{ inputs.baseline_through }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Record the migrations production already has
        run: node scripts/db-migrate.mjs --baseline-through="$BASELINE_THROUGH" --status
